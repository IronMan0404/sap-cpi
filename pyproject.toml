[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sap-cpi"
version = "0.1.0"
description = "Small, secure Python client for a SAP Cloud Integration POC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["python-dotenv>=1.0,<2", "requests>=2.31,<3", "PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
sap-cpi = "sap_cpi.cli:main"
cpi = "sap_cpi.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
