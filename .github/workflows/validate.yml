name: Validate SAP CPI project
run-name: Validate SAP CPI project - ${{ github.event_name }}

on:
  pull_request:
  push:
    branches:
      - master
    paths:
      - "src/**"
      - "tests/**"
      - "config/**"
      - "flows/**"
      - "scenarios/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - name: Validate manifests
        run: |
          python -c "from pathlib import Path; import yaml; [yaml.safe_load(p.read_text()) for p in Path('config').glob('*.yaml')]; print('manifests valid')"
      - name: Check required artifact
        run: test -s artifacts/SAP_SMOKE_TEST_FLOW.zip
      - name: Build checked-in iFlow sources
        run: |
          python scripts/build_iflow.py flows/SAP_SMOKE_TEST_FLOW build/validate-smoke.zip
          python scripts/build_iflow.py SAP_TIMER_GROOVY_DEMO build/validate-demo.zip
