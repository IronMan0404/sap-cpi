name: SAP CPI SDLC pipeline

on:
  workflow_call:
    inputs:
      manifest: {required: true, type: string}
      source: {required: true, type: string}
      bundle: {required: true, type: string}
      artifact_id: {required: true, type: string}
      operation: {required: true, type: string}
      version: {required: true, type: string}
    secrets:
      CPI_SERVICE_KEY_JSON: {required: true}

permissions:
  contents: read

concurrency:
  group: sap-cpi-${{ inputs.artifact_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - name: Validate selected manifest and source
        run: python -c "from pathlib import Path; import yaml; yaml.safe_load(Path('${{ inputs.manifest }}').read_text()); assert Path('${{ inputs.source }}').is_dir(); print('source and manifest valid')"

  build:
    name: Build iFlow bundle
    needs: validate
    if: inputs.operation != 'deploy-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Build from checked-in source
        run: python scripts/build_iflow.py "${{ inputs.source }}" "build/${{ inputs.bundle }}"
      - uses: actions/upload-artifact@v4
        with:
          name: cpi-iflow-bundle
          path: build/${{ inputs.bundle }}
          if-no-files-found: error

  upload:
    name: Upload or update draft
    needs: build
    if: inputs.operation != 'deploy-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: cpi-iflow-bundle, path: build}
      - name: Write temporary service key
        env:
          CPI_SERVICE_KEY_JSON: "${{ secrets.CPI_SERVICE_KEY_JSON }}"
        run: python -c "import os; from pathlib import Path; Path('CPI-API-KEY.json').write_text(os.environ['CPI_SERVICE_KEY_JSON'], encoding='utf-8')"
      - run: cpi --key-file CPI-API-KEY.json login
      - name: Upload new artifact
        if: inputs.operation == 'upload'
        run: cpi --key-file CPI-API-KEY.json flow upload --manifest "${{ inputs.manifest }}" --bundle "build/${{ inputs.bundle }}" --version "${{ inputs.version }}" --apply
      - name: Update existing artifact
        if: inputs.operation == 'update'
        run: cpi --key-file CPI-API-KEY.json flow update --manifest "${{ inputs.manifest }}" --bundle "build/${{ inputs.bundle }}" --version "${{ inputs.version }}" --apply
      - if: always()
        run: rm -f CPI-API-KEY.json

  verify-upload:
    name: Verify uploaded draft
    needs: [build, upload]
    if: inputs.operation != 'deploy-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: cpi-iflow-bundle, path: build}
      - name: Write temporary service key
        env:
          CPI_SERVICE_KEY_JSON: "${{ secrets.CPI_SERVICE_KEY_JSON }}"
        run: python -c "import os; from pathlib import Path; Path('CPI-API-KEY.json').write_text(os.environ['CPI_SERVICE_KEY_JSON'], encoding='utf-8')"
      - run: cpi --key-file CPI-API-KEY.json flow verify --manifest "${{ inputs.manifest }}" --bundle "build/${{ inputs.bundle }}" --version active
      - if: always()
        run: rm -f CPI-API-KEY.json

  version:
    name: Save new CPI version
    needs: verify-upload
    if: inputs.operation != 'deploy-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install .
      - name: Write temporary service key
        env:
          CPI_SERVICE_KEY_JSON: "${{ secrets.CPI_SERVICE_KEY_JSON }}"
        run: python -c "import os; from pathlib import Path; Path('CPI-API-KEY.json').write_text(os.environ['CPI_SERVICE_KEY_JSON'], encoding='utf-8')"
      - run: cpi --key-file CPI-API-KEY.json flow version --manifest "${{ inputs.manifest }}" --version "${{ inputs.version }}" --apply
      - if: always()
        run: rm -f CPI-API-KEY.json

  verify-version:
    name: Verify saved version
    needs: version
    if: inputs.operation != 'deploy-only'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install .
      - uses: actions/download-artifact@v4
        with: {name: cpi-iflow-bundle, path: build}
      - name: Write temporary service key
        env:
          CPI_SERVICE_KEY_JSON: "${{ secrets.CPI_SERVICE_KEY_JSON }}"
        run: python -c "import os; from pathlib import Path; Path('CPI-API-KEY.json').write_text(os.environ['CPI_SERVICE_KEY_JSON'], encoding='utf-8')"
      - run: cpi --key-file CPI-API-KEY.json flow verify --manifest "${{ inputs.manifest }}" --bundle "build/${{ inputs.bundle }}" --version "${{ inputs.version }}"
      - if: always()
        run: rm -f CPI-API-KEY.json

  deploy:
    name: Deploy approved version
    needs: verify-version
    if: inputs.operation != 'deploy-only'
    environment: cpi-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install .
      - name: Write temporary service key
        env:
          CPI_SERVICE_KEY_JSON: "${{ secrets.CPI_SERVICE_KEY_JSON }}"
        run: python -c "import os; from pathlib import Path; Path('CPI-API-KEY.json').write_text(os.environ['CPI_SERVICE_KEY_JSON'], encoding='utf-8')"
      - run: cpi --key-file CPI-API-KEY.json flow deploy --manifest "${{ inputs.manifest }}" --version "${{ inputs.version }}" --apply
      - if: always()
        run: rm -f CPI-API-KEY.json

  redeploy:
    name: Redeploy approved existing version
    needs: validate
    if: inputs.operation == 'deploy-only'
    environment: cpi-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install .
      - name: Write temporary service key
        env:
          CPI_SERVICE_KEY_JSON: "${{ secrets.CPI_SERVICE_KEY_JSON }}"
        run: python -c "import os; from pathlib import Path; Path('CPI-API-KEY.json').write_text(os.environ['CPI_SERVICE_KEY_JSON'], encoding='utf-8')"
      - run: cpi --key-file CPI-API-KEY.json flow deploy --manifest "${{ inputs.manifest }}" --version "${{ inputs.version }}" --apply
      - if: always()
        run: rm -f CPI-API-KEY.json

  verify-runtime:
    name: Verify runtime and messages
    needs: [deploy, redeploy]
    if: always() && (needs.deploy.result == 'success' || needs.redeploy.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install .
      - name: Write temporary service key
        env:
          CPI_SERVICE_KEY_JSON: "${{ secrets.CPI_SERVICE_KEY_JSON }}"
        run: python -c "import os; from pathlib import Path; Path('CPI-API-KEY.json').write_text(os.environ['CPI_SERVICE_KEY_JSON'], encoding='utf-8')"
      - name: Verify runtime is started
        run: cpi --key-file CPI-API-KEY.json flow status --id "${{ inputs.artifact_id }}" | tee runtime-status.json
      - name: Fail if CPI runtime is not started
        run: python -c "import json; p=json.load(open('runtime-status.json')); assert any(v == 'STARTED' for v in (p.get('Status'), p.get('d', {}).get('Status'))), p"
      - name: Verify recent processing logs are available
        run: cpi --key-file CPI-API-KEY.json list messages --top 5
      - if: always()
        run: rm -f CPI-API-KEY.json
